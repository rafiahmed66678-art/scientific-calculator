 const expr=()=>{let a=term();while(is("+","−")){const o=nx().v,b=term(),x=a;a=o==="+"?v=>x(v)+b(v):v=>x(v)-b(v)}return a};
 const term=()=>{let a=un();for(;;){let o;if(is("×","÷"))o=nx().v;else if(sv(pk()))o="×";else break;const b=un(),x=a;
  a=o==="×"?v=>x(v)*b(v):v=>{const d=b(v);if(d===0)throw MERR;return x(v)/d}}return a};
 const un=()=>{if(is("−","+")){const o=nx().v,a=un();return o==="−"?v=>-a(v):a}return perm()};
 const perm=()=>{let a=frac();while(is("nPr","nCr")){const o=nx().v,b=frac(),x=a;
  a=v=>{const n=x(v),r=b(v);if(!Number.isInteger(n)||!Number.isInteger(r)||r>n||r<0)throw MERR;let p=1;for(let i=0;i<r;i++)p*=n-i;if(o==="nCr")for(let i=2;i<=r;i++)p/=i;return Math.round(p)}}return a};
 const frac=()=>{let a=power();for(;;){if(is("⁄")){nx();const b=power(),x=a;a=v=>{const d=b(v);if(d===0)throw MERR;return x(v)/d}}
  else if(is("⁀")){nx();const n=power();if(!is("⁄"))throw"Syntax ERROR";nx();const d=power(),x=a;a=v=>x(v)+n(v)/d(v)}else break}return a};
 const power=()=>{const b=post();if(is("^")){nx();const e=un();return v=>Math.pow(b(v),e(v))}return b};
 const post=()=>{let a=prim();while(is("!","%","°","ʳ","ᵍ")){const o=nx().v,x=a;
  a=o==="!"?v=>{const n=x(v);if(!Number.isInteger(n)||n<0||n>170)throw MERR;let f=1;for(let i=2;i<=n;i++)f*=i;return f}
   :o==="%"?v=>x(v)/100
   :o==="°"?v=>S.ang==="D"?x(v):S.ang==="R"?x(v)*Math.PI/180:x(v)*10/9
   :o==="ʳ"?v=>S.ang==="D"?x(v)*180/Math.PI:S.ang==="R"?x(v):x(v)*200/Math.PI
   :v=>S.ang==="D"?x(v)*.9:S.ang==="R"?x(v)*Math.PI/200:x(v)}return a};
 const prim=()=>{const t=nx();if(!t)throw"Syntax ERROR";
  if(t.t==="n")return()=>t.v;
  if(t.t==="v")return t.v==="Ans"?()=>S.ans:()=>Math.floor(Math.random()*1000)/1000;
  if(t.t==="f"){if(!is("("))throw"Syntax ERROR";nx();const a=[];do{a.push(expr())}while(is(",")&&nx());if(is(")"))nx();const n=t.v;
   if(n==="∫")return v=>{const f=a[0],lo=a[1](v),hi=a[2](v),N=2000,h=(hi-lo)/N;let s=0;for(let i=0;i<=N;i++)s+=(i===0||i===N?1:i%2?4:2)*f({...v,X:lo+i*h});return +(s*h/3).toPrecision(12)};
   if(n==="Σ")return v=>{let s=0;const lo=a[1](v),hi=a[2](v);for(let x=lo;x<=hi&&x-lo<1e6;x++)s+=a[0]({...v,X:x});return s};
   if(n==="d/dx")return v=>{const f=a[0],x=a[1](v),h=1e-3,g=d=>f({...v,X:x+d});return +((-g(2*h)+8*g(h)-8*g(-h)+g(-2*h))/(12*h)).toPrecision(10)};
   return v=>FN[n](...a.map(f=>f(v)))}
  const o=t.v;
  if(o==="(" ){const e=expr();if(is(")"))nx();return e}
  if(o==="√"){const x=post();return v=>Math.sqrt(x(v))}
  if(o==="∛"){const x=post();return v=>Math.cbrt(x(v))}
  if(o==="π")return()=>Math.PI;if(o==="e")return()=>Math.E;
  if("ABCDEFXYM".includes(o)&&o.length===1)return v=>v[o]??0;
  throw"Syntax ERROR"};
 const f=expr();if(p<T.length)throw"Syntax ERROR";return f}
const ev=(s,v)=>compile(s)(v||S.vars);

/* ---------- formatting ---------- */
function toFrac(x){if(Number.isInteger(x))return null;const s=x<0?-1:1,a=Math.abs(x);let n0=0,d0=1,n1=1,d1=0,b=a;
 for(let i=0;i<40;i++){const q=Math.floor(b),n2=q*n1+n0,d2=q*d1+d0;n0=n1;d0=d1;n1=n2;d1=d2;if(d1>9999||n1>99999999)return null;
  if(Math.abs(a-n1/d1)<1e-13*Math.max(1,a))return[s*n1,d1];b=1/(b-q);if(!isFinite(b))break}return null}
const sci=(m,e)=>`${m}×10<sup>${e}</sup>`;
function fmtNum(x){if(x===0)return"0";if(S.base!==10&&Number.isInteger(x))return x.toString(S.base).toUpperCase();
 const e=Math.floor(Math.log10(Math.abs(x)));
 if(S.eng){const e3=Math.floor(e/3)*3;return sci(+(x/10**e3).toPrecision(10),e3)}
 if(S.fmt==="F")return x.toFixed(S.dig);
 if(S.fmt==="S"){const[m,ex]=x.toExponential(S.dig-1).split("e");return sci(m,+ex)}
 const s=+x.toPrecision(10);
 if(Math.abs(s)>=1e10||Math.abs(s)<1e-9||/e/.test(String(s))){const[m,ex]=s.toExponential(9).split("e");return sci(+m,+ex)}
 return String(s)}
function dmsStr(v){const s=v<0?"−":"",a=Math.abs(v),d=Math.floor(a),r=(a-d)*60,m=Math.floor(r);return`${s}${d}°${m}′${+((r-m)*60).toFixed(2)}″`}
const stack=(n,d)=>`<span class="fr"><i>${n}</i><i>${d}</i></span>`;
function resHTML(){const r=S.res;if(!r)return"";const v=r.v,lab=r.lab||"";
 if(S.dms)return lab+dmsStr(v);
 if(S.math&&!S.dec&&S.fmt==="N"&&!S.eng&&S.base===10){const f=toFrac(v);if(f){let[n,d]=f;const sg=n<0?"−":"";n=Math.abs(n);
  if(S.mixed&&n>d)return lab+sg+Math.floor(n/d)+stack(n%d,d);return lab+sg+stack(n,d)}}
 return lab+fmtNum(v)}
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;");

/* ---------- state actions ---------- */
function put(t,fresh){if(S.done){S.done=0;if(!fresh&&/^(?:[+−×÷^!%↑]|⁄|nPr|nCr)/.test(t)){S.ex="Ans";S.cur=3}else{S.ex="";S.cur=0}}
 S.res=null;S.hi=-1;if(S.ins&&S.cur<S.ex.length)S.ex=S.ex.slice(0,S.cur)+S.ex.slice(S.cur+1);
 S.ex=S.ex.slice(0,S.cur)+t+S.ex.slice(S.cur);S.cur+=t.length}
function eq(){if(!S.ex)return;try{let v=ev(toEng(S.ex));if(typeof v!=="number"||!isFinite(v))throw MERR;v=+v.toPrecision(15);
  S.ans=v;S.res={v};S.done=1;S.dec=/\./.test(S.ex)?1:0;S.mixed=0;S.dms=0;pushHist()}
 catch(e){S.err=typeof e==="string"?e:"Syntax ERROR";S.cur=S.ex.length;S.done=0;S.res=null}}
function pushHist(){const h=resHTML().replace(/<sup>/g,"^").replace(/<[^>]+>/g,"");S.hist.unshift([S.ex,h]);if(S.hist.length>40)S.hist.pop();
 $("#hist").innerHTML=S.hist.map((x,i)=>`<li><button data-h="${i}"><small>${esc(toEng(x[0]))}</small>= ${esc(x[1])}</button></li>`).join("")}
function vars(){const o=[];tok(toEng(S.ex)).forEach(t=>{if(t.t==="o"&&t.v.length===1&&"ABCDEFXYM".includes(t.v)&&!o.includes(t.v))o.push(t.v)});return o}
function doSolve(){try{const[l,r]=toEng(S.ex).split("="),f=compile(l),g=compile(r||"0"),h=x=>{const w={...S.vars,X:x};return f(w)-g(w)};
  let x=S.vars.X||0,ok=0;
  for(let i=0;i<200;i++){const y=h(x),dx=1e-7*(1+Math.abs(x)),d=(h(x+dx)-y)/dx;if(!isFinite(y)||!isFinite(d)||d===0)break;const n=x-y/d;if(Math.abs(n-x)<1e-14*(1+Math.abs(x))){x=n;ok=1;break}x=n}
  if(!ok||Math.abs(h(x))>1e-7){ok=0;let px=-1000,py=h(px);for(let t=-999.5;t<=1000;t+=.5){const ty=h(t);if(isFinite(py)&&isFinite(ty)&&py*ty<=0){let a=px,b=t;for(let k=0;k<200;k++){const m=(a+b)/2;(h(a)*h(m)<=0)?b=m:a=m}x=(a+b)/2;ok=1;break}px=t;py=ty}}
  if(!ok||Math.abs(h(x))>1e-6)throw"Can't Solve";x=+x.toPrecision(12);S.vars.X=x;S.ans=x;S.res={v:x,lab:"X="};S.done=1;S.dec=0;S.dms=0}
 catch(e){S.err=typeof e==="string"?e:"Syntax ERROR"}}
const CT=[["c₀ 299792458","299792458"],["h 6.626×10⁻³⁴","6.62607015×10^(−34)"],["G 6.674×10⁻¹¹","6.6743×10^(−11)"],["g 9.80665","9.80665"],["e 1.602×10⁻¹⁹","1.602176634×10^(−19)"],["Nₐ 6.022×10²³","6.02214076×10^(23)"],["k 1.381×10⁻²³","1.380649×10^(−23)"],["R 8.3145","8.314462618"],["mₑ 9.109×10⁻³¹","9.1093837015×10^(−31)"]];
const CV=[["in▸cm","×2.54"],["cm▸in","÷2.54"],["mile▸km","×1.609344"],["km▸mile","÷1.609344"],["lb▸kg","×0.45359237"],["kg▸lb","÷0.45359237"],["°F▸°C","F"],["°C▸°F","C"]];
const MN={
 mode:()=>({t:"MODE",i:[["Deg",()=>S.ang="D"],["Rad",()=>S.ang="R"],["Gra",()=>S.ang="G"],["Fix",()=>S.menu={t:"Fix 0~9 ?",dg:"F"}],["Sci",()=>S.menu={t:"Sci 1~10 (0=10) ?",dg:"S"}],["Norm",()=>{S.fmt="N";S.eng=0}],[S.math?"LineIO":"MathIO",()=>S.math^=1]]}),
 const:()=>({t:"CONST",i:CT.map(c=>[c[0],()=>put("("+c[1]+")")])}),
 conv:()=>({t:"CONV",i:CV.map(c=>[c[0],()=>{const b=S.done?"Ans":(S.ex||"Ans");S.ex=c[1]==="F"?`((${b})−32)÷1.8`:c[1]==="C"?`(${b})×1.8+32`:`(${b})${c[1]}`;S.done=0;eq()}])}),
 clr:()=>({t:"CLR",i:[["Setup",()=>{S.ang="D";S.fmt="N";S.eng=0;S.math=1;S.base=10}],["Memory",()=>{S.vars={}}],["All",()=>{S.ang="D";S.fmt="N";S.eng=0;S.math=1;S.base=10;S.vars={};S.hist=[];$("#hist").innerHTML=""}]]}),
 drg:()=>({t:"DRG▸",i:[["°",()=>put("°")],["ʳ",()=>put("ʳ")],["ᵍ",()=>put("ᵍ")]]}),
 base:()=>({t:"BASE",i:[["DEC",()=>S.base=10],["HEX",()=>S.base=16],["BIN",()=>S.base=2],["OCT",()=>S.base=8]]})};
const CUR=/^(?:[a-zA-Z#]+\(|Ans|Ran#|nPr|nCr|×10\^\(|d\/dx\(|[∫Σ]\()/,CUL=/(?:[a-zA-Z#]+\(|Ans|Ran#|nPr|nCr|×10\^\(|d\/dx\(|[∫Σ]\()$/;
function edit(){if(S.done){S.done=0;S.res=null}}
const A={
 T:h=>{const t=h+"¦".repeat(HD[h]-1)+"⟧";put(t);S.cur-=t.length-1},pw:e=>put("↑"+e+"⟧"),bx:b=>{put(b);A.T("↑")},
 neg:()=>put("−",1),hyp:()=>S.hyp=1,rcl:()=>S.pend="rcl",sto:()=>S.pend="sto",eng:()=>S.eng^=1,sd:()=>S.dec^=1,mixed:()=>S.mixed^=1,dms:()=>S.dms^=1,
 t:n=>{if(S.hyp)n=n.replace(/(sin|cos|tan)/,"$1h");S.hyp=0;put(n+"(")},
 mp:g=>{try{const v=S.done?S.ans:ev(toEng(S.ex));S.vars.M=(S.vars.M||0)+ +g*v;S.ans=v;if(!S.done){S.res={v};S.done=1;S.dec=/\./.test(S.ex)?1:0}}catch(e){S.err=typeof e==="string"?e:"Syntax ERROR"}},
 eq,ac:()=>{S.ex="";S.cur=0;S.res=null;S.done=0;S.hyp=0;S.pend=0;S.menu=null;S.prompt=null;S.hi=-1},
 off:()=>{S.off=1},ins:()=>S.ins^=1,soon:()=>{S.err="Not available"},
 del:()=>{edit();{const s=S.ex,c=S.cur,p=s[c-1];if(HD[p]){const e=slotsOf(s,c-1),end=e[e.length-1][1];if(/^¦*$/.test(s.slice(c,end))){S.ex=s.slice(0,c-1)+s.slice(end+1);S.cur=c-1}else S.cur=c-1;return}if(p==="¦"||p==="⟧"){S.cur=c-1;return}}const b=S.ex.slice(0,S.cur),m=CUL.exec(b),n=m?m[0].length:b?1:0;S.ex=b.slice(0,b.length-n)+S.ex.slice(S.cur);S.cur-=n},
 menu:n=>{S.menu=MN[n]()},
 mv:d=>{if(d==="l"||d==="r"){if(S.done){S.done=0;S.res=null;S.cur=d==="l"?S.ex.length:0;return}
   if(d==="l"){const m=CUL.exec(S.ex.slice(0,S.cur));S.cur=Math.max(0,S.cur-(m?m[0].length:1))}else{const m=CUR.exec(S.ex.slice(S.cur));S.cur=Math.min(S.ex.length,S.cur+(m?m[0].length:1))}return}
  if(!S.done&&vmove(d))return;if(!S.hist.length)return;S.hi=d==="u"?Math.min(S.hist.length-1,S.hi+1):Math.max(0,S.hi-1);S.ex=S.hist[S.hi][0];S.cur=S.ex.length;S.res=null;S.done=0},
 calc:()=>{if(!S.ex)return;const v=vars();if(!v.length)return eq();S.prompt={vs:v,i:0,buf:"",done:eq}},
 solve:()=>{if(!S.ex.includes("=")){S.err="Syntax ERROR";return}S.prompt={vs:["X"],i:0,buf:"",done:doSolve}}
};
function run(a){if(a===undefined||a==="")return;if(a[0]==="@"){const[f,x]=a.slice(1).split(":");A[f](x)}else put(a)}

function press(id){
 if(S.off){if(id==="on"){S.off=0;A.ac()}render();return}
 const sh=S.shift,al=S.alpha;S.err="";
 if(id==="shift"){S.shift=sh?0:1;S.alpha=0;return render()}
 if(id==="alpha"){S.alpha=al?0:1;S.shift=0;return render()}
 S.shift=S.alpha=0;
 if(S.prompt){const P=S.prompt;
  if(/^d\d$/.test(id))P.buf+=id[1];else if(id==="dot")P.buf+=".";else if(id==="neg"||id==="sub")P.buf=P.buf[0]==="−"?P.buf.slice(1):"−"+P.buf;
  else if(id==="del")P.buf=P.buf.slice(0,-1);else if(id==="ac")S.prompt=null;
  else if(id==="eq"){try{if(P.buf)S.vars[P.vs[P.i]]=ev(P.buf)}catch(e){}P.i++;P.buf="";if(P.i>=P.vs.length){S.prompt=null;P.done()}}
  return render()}
 if(S.pend){const p=S.pend,L=LM[id];S.pend=0;if(L){if(p==="sto"){S.vars[L]=S.ans}else put(L)}return render()}
 if(S.menu){const m=S.menu;if(/^d\d$/.test(id)){const n=+id[1];
   if(m.dg){S.menu=null;S.fmt=m.dg;S.dig=m.dg==="S"&&n===0?10:n;S.eng=0;return render()}
   if(n>=1&&n<=m.i.length){S.menu=null;m.i[n-1][1]();return render()}return render()}
  S.menu=null;if(id==="ac"||id==="mode")return render()}
 const k=KM[id];if(!k)return;
 if(id!=="hyp"&&S.hyp&&!/^(sin|cos|tan)$/.test(id))S.hyp=0;
 run(k[sh?1:al?2:0]);render()}

function render(){
 const lcd=$("#lcd");lcd.classList.toggle("off",!!S.off);if(S.off)return;
 const on=(id,c)=>$(id).classList.toggle("on",!!c);
 on("#iS",S.shift);on("#iA",S.alpha);on("#iH",S.hyp);on("#iM",S.vars.M);on("#iO",S.pend);on("#iF",S.fmt!=="N"||S.eng||S.base!==10);
 $("#iD").textContent={D:"D",R:"R",G:"G"}[S.ang];on("#iD",1);
 $("#iF").textContent=S.base!==10?{16:"HEX",2:"BIN",8:"OCT"}[S.base]:S.eng?"ENG":S.fmt==="F"?"FIX":S.fmt==="S"?"SCI":"";
 $("#iL").textContent=S.math?"Math ▼▲":"Line";
 $("#k_shift").classList.toggle("on",!!S.shift);$("#k_alpha").classList.toggle("on",!!S.alpha);
 const L=$("#ln"),R=$("#rs");R.className="rs";L.className="ln"+(S.done?" done":"");
 if(S.menu){const m=S.menu;L.innerHTML=`<span class="mt">${m.t}</span>`;L.style.cssText="overflow:visible;white-space:normal;line-height:1.2;min-height:0;font-size:4cqw";
  R.innerHTML=m.i?`<div class="mn" style="width:100%;text-align:left">${m.i.map((x,i)=>`<span>${i+1}:${x[0]}</span>`).join("")}</div>`:"";
  R.style.cssText="margin-top:0;justify-content:flex-start;align-items:flex-start;font-size:4cqw";return}
 L.style.cssText="";R.style.cssText="";
 L.innerHTML=view(S.ex,S.cur);
 const cu=L.querySelector(".cu");L.scrollLeft=Math.max(0,cu.offsetLeft-L.clientWidth+30);
 if(S.prompt){const P=S.prompt;R.innerHTML=`${P.vs[P.i]}? ${esc(P.buf)||fmtNum(S.vars[P.vs[P.i]]||0)}`;R.classList.add("err");return}
 if(S.err){R.textContent=S.err;R.classList.add("err")}else R.innerHTML=resHTML()}

/* ---------- events ---------- */
document.addEventListener("click",e=>{const b=e.target.closest("[data-k]");if(b){b.blur();try{navigator.vibrate&&navigator.vibrate(6)}catch(_){}press(b.dataset.k);return}
 const h=e.target.closest("[data-h]");if(h){const x=S.hist[+h.dataset.h];S.ex=x[0];S.cur=x[0].length;S.done=0;S.res=null;render()}});
addEventListener("keydown",e=>{if(e.ctrlKey||e.metaKey||e.altKey)return;const k=e.key;
 const M={Enter:"eq","=":"eq",Backspace:"del",Escape:"ac",Delete:"ac",ArrowLeft:"left",ArrowRight:"right",ArrowUp:"up",ArrowDown:"down",".":"dot","+":"add","-":"sub","*":"mul","/":"div","^":"pw",r:"sqrt"};
 let id=/^\d$/.test(k)?"d"+k:M[k];
 if(id){e.preventDefault();return press(id)}
 const T={"(":"(",")":")","!":"!","%":"%",",":",",s:"sin(",c:"cos(",t:"tan(",l:"log(",n:"ln(",p:"π",e:"e",a:"Ans"}[k];
 if(T&&!S.menu&&!S.prompt&&!S.off){e.preventDefault();S.shift=S.alpha=0;put(T);render()}});
const root=document.documentElement;
function theme(t){root.dataset.t=t;$("#theme").textContent=t==="dark"?"লাইট মোড":"ডার্ক মোড";try{localStorage.setItem("calc-theme",t)}catch(_){}}
$("#theme").onclick=()=>theme(root.dataset.t==="dark"?"light":"dark");
let t0=null;try{t0=localStorage.getItem("calc-theme")}catch(_){}
theme(t0||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light"));
render();
</script>
